<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>달빛 짝맞추기</title>
    <meta name="description" content="달빛 짝맞추기 — 놀이터에서 바로 플레이" />
    <meta name="theme-color" content="#1A1033" />

    <!-- 이 게임만의 홈 화면 앱 정보 -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="../../assets/icons/moon-match-192.png" />
    <link rel="apple-touch-icon" href="../../assets/icons/moon-match-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="달빛 짝맞추기" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="../../css/app.css" />
    <script>
      // 안드로이드 크롬의 설치 신호는 일찍 올 수 있어서 페이지 맨 앞에서 붙잡아 둔다
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('install-ready'));
      });
    </script>
    <script type="module">
      import { start } from '../../js/launcher.js';
      start('moon-match');
    </script>
  </head>
  <body class="launcher-body">
    <main id="view"></main>
  </body>
</html>
